name: Keep Render Alive (Ping Bot)

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging ScamShield API..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://scamshield-u6c4.onrender.com/api/v1/health")
          echo "Response Status: $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
            echo "API is awake and healthy!"
          else
            echo "API responded with status $STATUS"
          fi
