[project]
name = "scamshield-api"
version = "0.1.0"
description = "FastAPI threat intelligence and explainable risk-scoring backend for ScamShield AI"
authors = [
    { name = "Shrushti Dayma & Chanchal Jadhav" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api"]
